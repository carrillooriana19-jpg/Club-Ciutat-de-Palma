<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Equipo · Natación Sincronizada</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="authScreen"></div>

<div class="app" id="appShell" style="display:none;">
  <div class="rail no-print">
    <div class="rail-brand">
      <img src="assets/logo.jpg" alt="Mediterranea" class="rail-logo">
      <h1>Mi Equipo</h1>
      <p>Natación sincronizada</p>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <button onclick="logout()">🚪 Cerrar sesión</button>
    </div>
  </div>
  <main id="main"></main>
</div>

<div id="busyOverlay">Cargando...</div>

<dialog id="dialog">
  <div class="dialog-head" id="dialogTitle"></div>
  <div class="dialog-body" id="dialogBody"></div>
  <div class="dialog-foot">
    <button class="btn secondary" onclick="closeDialog()">Cancelar</button>
    <button class="btn" id="dialogSave">Guardar</button>
  </div>
</dialog>


  <script type="module" src="js/app.js"></script>
</body>
</html>
